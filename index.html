<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FBS Live Ticker</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0e;color:#f5f6f9;font-family:Arial,Helvetica,sans-serif}body{display:flex;flex-direction:column}.header{height:19%;min-height:42px;background:#151922;display:flex;align-items:center;gap:16px;padding:0 2%;border-bottom:4px solid #e52b3e}.brand{font-size:clamp(20px,3.2vw,49px);font-weight:900;white-space:nowrap}.brand span{color:#ff3a4e}.pill{font-size:clamp(12px,1.4vw,22px);font-weight:bold;background:#bb2335;padding:7px 13px;border-radius:5px;white-space:nowrap}.status{margin-left:auto;color:#b5c0d1;font-size:clamp(12px,1.3vw,21px);white-space:nowrap}.lane{flex:1;display:flex;align-items:center;overflow:hidden;position:relative}.track{display:flex;align-items:stretch;width:max-content;min-width:100%;height:83%;gap:14px;animation:slide 75s linear infinite}.lane:hover .track{animation-play-state:paused}.game{min-width:clamp(300px,29vw,560px);padding:12px 22px;background:#171c26;border:1px solid #343b4b;border-left:7px solid #e52b3e;border-radius:9px;display:flex;flex-direction:column;justify-content:space-around}.game.miami{border-color:#f47d20;box-shadow:inset 0 0 0 2px #0d6b43}.meta{display:flex;justify-content:space-between;color:#abb6c6;font-size:clamp(12px,1.3vw,22px);font-weight:bold}.teams{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:clamp(22px,2.6vw,45px);font-weight:900}.teams div{white-space:nowrap}.scores{color:#fff}.foot{height:9%;min-height:22px;background:#c32235;display:flex;align-items:center;justify-content:space-between;padding:0 2%;font-size:clamp(11px,1.1vw,18px);font-weight:bold}.message{width:100%;padding:3%;font-size:clamp(18px,2vw,34px);text-align:center}.small{color:#b8c3d4;font-size:.65em;margin-top:12px}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}button{border:0;background:#e52b3e;color:white;padding:8px 15px;border-radius:5px;font-weight:bold;cursor:pointer}
</style></head><body><header class="header"><div class="brand"><span>FBS</span> SCORECENTER</div><div class="pill">ALL FBS</div><div class="status" id="status">Starting…</div><button id="retry" title="Refresh scores">↻</button></header><main class="lane" id="lane"><div class="message">Loading college football scores…<div class="small">Checking live scoreboard feed</div></div></main><footer class="foot"><span>COLLEGE FOOTBALL • ALL FBS GAMES</span><span>30-SECOND REFRESH • PACIFIC TIME</span></footer><script>
(function(){'use strict';var lane=document.getElementById('lane'),status=document.getElementById('status'),cache=[];function safe(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function pacific(t){try{return new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date(t))+' PT'}catch(e){return 'Scheduled'}}function abbr(t){return t&&t.abbreviation||t&&t.shortDisplayName||t&&t.displayName||'TBD'}function render(items){if(!items.length){lane.innerHTML='<div class="message">No FBS games found for this date.<div class="small">Scores will appear when games are scheduled.</div></div>';return}var cards=items.map(function(e){var c=e.competitions&&e.competitions[0]||{},teams=c.competitors||[],home=teams.find(function(t){return t.homeAway==='home'})||{},away=teams.find(function(t){return t.homeAway==='away'})||{},state=e.status&&e.status.type||{},live=state.state==='in',done=state.completed,when=live?(e.status.displayClock||'')+' '+(e.status.period?'Q'+e.status.period:'LIVE'):done?'FINAL':pacific(e.date),isMiami=teams.some(function(t){return /Miami Hurricanes|Miami \(FL\)/i.test(t.team&&t.team.displayName||'')});return '<article class="game'+(isMiami?' miami':'')+'"><div class="meta"><span>'+safe(when)+'</span><span>'+safe(live?'● LIVE':done?'FINAL':c.broadcasts&&c.broadcasts[0]&&c.broadcasts[0].names&&c.broadcasts[0].names[0]||'UPCOMING')+'</span></div><div class="teams"><div>'+safe(abbr(away.team))+'</div><div class="scores">'+safe(away.score==null?'-':away.score)+' : '+safe(home.score==null?'-':home.score)+'</div><div>'+safe(abbr(home.team))+'</div></div><div class="meta"><span>'+safe(away.team&&away.team.displayName||'')+'</span><span>'+safe(home.team&&home.team.displayName||'')+'</span></div></article>'}).join('');lane.innerHTML='<div class="track" id="track">'+cards+cards+'</div>';var track=document.getElementById('track');track.style.animationDuration=Math.max(30,items.length*6)+'s'}function getDate(offset){var d=new Date(Date.now()+offset*86400000);return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(d).replace(/\D/g,'')}async function load(){status.textContent='Updating…';try{var dates=[getDate(0),getDate(1)];var all=[];for(var i=0;i<dates.length;i++){var url='https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300&dates='+dates[i];var response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);var data=await response.json();if(!Array.isArray(data.events))throw Error('Unexpected scoreboard response');all=all.concat(data.events)}var seen=new Set();cache=all.filter(function(g){if(seen.has(g.id))return false;seen.add(g.id);return true}).sort(function(a,b){var al=a.status&&a.status.type&&a.status.type.state==='in',bl=b.status&&b.status.type&&b.status.type.state==='in';return Number(bl)-Number(al)||new Date(a.date)-new Date(b.date)});render(cache);status.textContent=cache.length+' games • updated '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}catch(err){status.textContent='FEED OFFLINE';if(cache.length)render(cache);else lane.innerHTML='<div class="message">Live scoreboard connection unavailable<div class="small">'+safe(err.message)+' — check internet or ESPN feed access. Use ↻ to retry.</div></div>'}}document.getElementById('retry').onclick=load;load();setInterval(load,30000)})();
</script></body></html>
